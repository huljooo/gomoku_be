{% extends "base.html" %}

{% block title %}Gomoku - Logowanie{% endblock %}

{% block content %}
<div class="d-flex flex-column align-items-center justify-content-center vh-100 p-3">
    <div class="text center mb-4">
        <div class="d-flex justify-content-center gap-2 mb-2">
            <div class="stone-login stone-white"></div>
            <div class="stone-login stone-black"></div>
            <div class="stone-login stone-white"></div>
        </div>
        <h2 class="brand-text">GOMOKU</h2>
    </div>
    <div class="card glass-card rounded-4 p-4 p-sm-5 mb-5" style="max-width: 450px; width: 100%;">
        <div class="card-body p-0">
            {% if bad_creds %}
            <div class="alert alert-danger text-center" role="alert">Błędne dane logowania.</div>
            {% endif %}
            <form action="{% url 'check-creds' %}" method="POST">
                {% csrf_token %}
                {{ form }}
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Nazwa użytkownika">
                    <label for="username">Nazwa użytkownika</label>
                </div>
                <div class="form-floating mb-4">
                    <input type="password" class="form-control" id="password" name="password" placeholder="Hasło">
                    <label for="password">Hasło</label>
                </div>
                <button type="submit" class="btn btn-custom w-100 py-2 rounded-3 fw-bold">ZALOGUJ SIĘ</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
