<!doctype html>
<html lang="en">
{% load static %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gomoku - Logowanie</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="{% static 'aplikacja/style.css' %}">
</head>

<body class="d-flex flex-column align-items-center justify-content-center vh-100 p-3">
    <div class="text center mb-4">
      <div class="d-flex justify-content-center gap-2 mb-2">
          <div class="stone stone-white"></div>
          <div class="stone stone-black"></div>
          <div class="stone stone-white"></div>
      </div>
      <h2 class="brand-text">GOMOKU</h2>
    </div>
    <div class="card glass-card rounded-4 p-4 p-sm-5 mb-5" style="max-width: 450px; width: 100%;">
      <div class="card-body p-0">
        {% if bad_creds %} <div class="alert alert-danger text-center" role="alert">Błędne dane logowania.</div>{% endif %}
        <form action="{% url 'check-creds' %}" method="POST">
          {% csrf_token %}
          {{ form }}
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="username" name="username" placeholder="Nazwa użytkownika">
            <label for="username">Nazwa użytkownika</label>
          </div>
          <div class="form-floating mb-4">
            <input type="password" class="form-control" id="password"  name="password" placeholder="Hasło">
            <label for="password">Hasło</label>
          </div>
          <button type="submit" class="btn btn-dark w-100 py-2 rounded-3 fw-bold">ZALOGUJ SIĘ</button>
        </form>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
    integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
    crossorigin="anonymous"></script>

</body>

</html>
